```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Happy Birthday Cheema! 🎉</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      
      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Georgia, "Times New Roman", serif;

      background:
        radial-gradient(
          circle at 50% 40%,
          #fff7b2 0%,
          #ffb6d9 25%,
          #9b5de5 65%,
          #35155f 100%
        );

      color: white;
    }

    /* Main birthday card */
    .card {
      position: relative;
      z-index: 2;

      width: min(92%, 900px);

      padding: 30px 35px;

      text-align: center;

      background: rgba(255, 255, 255, 0.16);

      border: 2px solid rgba(255, 255, 255, 0.4);

      border-radius: 30px;

      box-shadow:
        0 25px 80px rgba(30, 0, 50, 0.4);

      backdrop-filter: blur(12px);

      animation: float 4s ease-in-out infinite;
    }

    /* Cake */
    .emoji {
      font-size: 3rem;

      animation:
        bounce 1.5s ease-in-out infinite;
    }

    /*
      Birthday message
    */
    h1 {
      margin: 12px 0 15px;

      font-size: clamp(2.2rem, 6vw, 4.5rem);

      line-height: 1.05;

      font-weight: 900;

      color: white;

      /*
        Strong shadow makes the words
        easier to see.
      */
      text-shadow:
        4px 4px 0 rgba(0, 0, 0, 0.75),
        0 0 15px rgba(255, 255, 255, 0.8);
    }

    /*
      Each individual word in the
      birthday message.
    */
    .word {
      display: inline-block;

      padding: 2px 5px;

      border-radius: 8px;

      color: white;

      transition:
        color 0.25s ease,
        background-color 0.25s ease,
        transform 0.25s ease,
        text-shadow 0.25s ease;
    }

    /*
      The currently highlighted word.
    */
    .word.active {
      color: #ff2020;

      background: rgba(255, 255, 255, 0.9);

      transform: scale(1.08);

      text-shadow:
        2px 2px 0 rgba(0, 0, 0, 0.7),
        0 0 12px rgba(255, 0, 0, 0.8);
    }

    /*
      Age message
    */
    h2 {
      margin: 20px 0;

      font-size: clamp(1.7rem, 4vw, 2.8rem);

      font-weight: 900;

      color: #fff9c4;

      text-shadow:
        3px 3px 0 rgba(0, 0, 0, 0.7);
    }

    /*
      Supporting message
    */
    .message {
      font-family: Arial, sans-serif;

      font-size: clamp(1.2rem, 3vw, 1.7rem);

      line-height: 1.6;

      font-weight: 700;

      color: white;

      text-shadow:
        2px 2px 4px rgba(0, 0, 0, 0.8);
    }

    /* Sparkles */
    .sparkle {
      position: fixed;

      z-index: 1;

      width: 8px;
      height: 8px;

      background: white;

      border-radius: 50%;

      box-shadow:
        0 0 10px 4px white;

      animation:
        sparkle 2s linear infinite;
    }

    .sparkle::before,
    .sparkle::after {
      content: "";

      position: absolute;

      background: white;

      border-radius: 50%;
    }

    .sparkle::before {
      width: 3px;
      height: 24px;

      left: 2.5px;
      top: -8px;
    }

    .sparkle::after {
      width: 24px;
      height: 3px;

      left: -8px;
      top: 2.5px;
    }

    /* Balloons */
    .balloon {
      position: fixed;

      bottom: -150px;

      width: 70px;
      height: 90px;

      border-radius:
        50% 50% 45% 45%;

      animation:
        rise 12s linear infinite;

      opacity: 0.85;

      z-index: 0;
    }

    .balloon::after {
      content: "";

      position: absolute;

      width: 2px;
      height: 100px;

      background:
        rgba(255, 255, 255, 0.6);

      left: 50%;
      top: 85px;
    }

    .b1 {
      left: 8%;
      background: #ff4d6d;
      animation-delay: 0s;
    }

    .b2 {
      left: 25%;
      background: #ffd166;
      animation-delay: 3s;
    }

    .b3 {
      left: 70%;
      background: #06d6a0;
      animation-delay: 1s;
    }

    .b4 {
      left: 88%;
      background: #4cc9f0;
      animation-delay: 5s;
    }

    /* Confetti */
    .confetti {
      position: fixed;

      top: -20px;

      width: 10px;
      height: 20px;

      animation:
        fall 5s linear infinite;

      z-index: 3;
    }

    /* Animations */

    @keyframes sparkle {
      0% {
        transform:
          scale(0)
          rotate(0deg);

        opacity: 0;
      }

      30% {
        opacity: 1;
      }

      70% {
        opacity: 1;
      }

      100% {
        transform:
          scale(1.5)
          rotate(180deg);

        opacity: 0;
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform:
          scale(1.2)
          rotate(-5deg);
      }
    }

    @keyframes rise {
      0% {
        transform:
          translateY(0)
          rotate(-5deg);
      }

      100% {
        transform:
          translateY(-120vh)
          rotate(10deg);
      }
    }

    @keyframes fall {
      0% {
        transform:
          translateY(-20px)
          rotate(0deg);
      }

      100% {
        transform:
          translateY(110vh)
          rotate(720deg);
      }
    }

    /*
      Accessibility:
      Respect devices where reduced
      motion has been requested.
    */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <!-- Balloons -->
  <div class="balloon b1"></div>
  <div class="balloon b2"></div>
  <div class="balloon b3"></div>
  <div class="balloon b4"></div>


  <!-- Sparkles -->
  <div
    class="sparkle"
    style="left:10%; top:20%; animation-delay:0s;">
  </div>

  <div
    class="sparkle"
    style="left:20%; top:70%; animation-delay:0.7s;">
  </div>

  <div
    class="sparkle"
    style="left:35%; top:15%; animation-delay:1.2s;">
  </div>

  <div
    class="sparkle"
    style="left:55%; top:80%; animation-delay:0.4s;">
  </div>

  <div
    class="sparkle"
    style="left:70%; top:25%; animation-delay:1.8s;">
  </div>

  <div
    class="sparkle"
    style="left:85%; top:65%; animation-delay:0.9s;">
  </div>

  <div
    class="sparkle"
    style="left:92%; top:15%; animation-delay:1.4s;">
  </div>


  <!-- Birthday message -->
  <main class="card">

    <div class="emoji">
      🎂
    </div>


    <!--
      Only these words are animated.
    -->
    <h1 id="birthdayMessage">

      <span class="word">Happy</span>
      <span class="word">Birthday</span>
      <span class="word">Cheema.</span>

      <br>

      <span class="word">You</span>
      <span class="word">turn</span>
      <span class="word">92</span>
      <span class="word">today!</span>

    </h1>


    <h2>
      🎉 🎈 🎁
    </h2>


    <p class="message">
      Wishing you a wonderful birthday filled with
      happiness, laughter, love, and unforgettable moments! ✨
    </p>


    <div class="emoji">
      🥳 🎈 🎁 🎊
    </div>

  </main>


  <!-- Confetti -->
  <script>

    /*
      Create 80 pieces of confetti.
    */

    const colors = [
      "#ff4d6d",
      "#ffd166",
      "#06d6a0",
      "#4cc9f0",
      "#ffffff",
      "#ff9f1c",
      "#f72585"
    ];


    for (let i = 0; i < 80; i++) {

      const confetti =
        document.createElement("div");

      confetti.className =
        "confetti";

      confetti.style.left =
        Math.random() * 100 + "vw";

      confetti.style.backgroundColor =
        colors[
          Math.floor(
            Math.random() * colors.length
          )
        ];

      confetti.style.animationDelay =
        Math.random() * 5 + "s";

      confetti.style.animationDuration =
        3 + Math.random() * 4 + "s";

      document.body.appendChild(confetti);
    }


    /*
      WORD-BY-WORD HIGHLIGHTING
    */

    const words =
      document.querySelectorAll(
        "#birthdayMessage .word"
      );

    let currentWord = 0;


    function highlightNextWord() {

      /*
        Turn every word back to
        its normal white colour.
      */

      words.forEach(word => {
        word.classList.remove("active");
      });


      /*
        Highlight the current word.
      */

      words[currentWord]
        .classList.add("active");


      /*
        Move to the next word.
      */

      currentWord++;


      /*
        Start again after
        "today!"
      */

      if (currentWord >= words.length) {
        currentWord = 0;
      }
    }


    /*
      Start with "Happy".
    */

    highlightNextWord();


    /*
      Move to the next word every
      1.1 seconds.

      1100 milliseconds = 1.1 seconds.
    */

    setInterval(
      highlightNextWord,
      1100
    );

  </script>

</body>
</html>

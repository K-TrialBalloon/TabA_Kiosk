<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Activity Display</title>

    <link rel="stylesheet" href="styles.css">

</head>


<body>


    <!-- Clock Display Panel -->
    <div id="clockPanel">

        <h1 id="dateHeading"></h1>

        <h2 id="timeHeading"></h2>

    </div>



    <!-- Activity Display Panel -->
    <div id="activityPanel">

        <div id="normalActivityPanel">

            <div id="activityPreText"></div>
            <div id="activityHeading"></div>

        </div>
        <!-- Special Activity Page -->
        <iframe
            id="specialFrame"
            title="Special Activity"
            src="about:blank"
            style="
                display:none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                margin: 0;
                padding: 0;
                border: none;
                box-sizing: border-box;
                z-index: 10;
            ">
        </iframe>

    </div>

    <div id="nightOverlay"></div>
    <button onclick="speak1()">Test TTS</button>
    <!-- Application Logic -->
    <script src="script.js"></script>


</body>

</html>
